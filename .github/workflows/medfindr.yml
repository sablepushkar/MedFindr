name: MedFindr Python Checks

on:
  push:
    branches: [main, v1.1-development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run urgency evaluation
        run: python scripts/evaluate.py

      - name: Run medication signal evaluation
        run: python scripts/evaluate_signals.py

      - name: Run review workflow evaluation
        run: python scripts/evaluate_reviews.py
