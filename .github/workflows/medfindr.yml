name: MedFindr checks

on:
  push:
    branches: [main, v1.1-development, v1.2-development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Application import smoke test
        run: python -c "import app; print('MedFindr app import OK')"
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Urgency evaluation
        run: python scripts/evaluate.py
      - name: SignalGraph evaluation
        run: python scripts/evaluate_signals.py
