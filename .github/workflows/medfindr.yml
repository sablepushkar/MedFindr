name: MedFindr CI
on:
  push:
    branches: [main, v1.2-development, v2-development]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Application import smoke test
        run: python -c "import app; print('MedFindr app import OK')"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Evaluate urgency fixtures
        run: python scripts/evaluate.py
      - name: Evaluate SignalGraph fixtures
        run: python scripts/evaluate_signals.py
      - name: Evaluate v2 review fixtures
        run: python scripts/evaluate_reviews.py
