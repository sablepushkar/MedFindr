name: MedFindr Python Checks

on:
  push:
    branches: [main, v1.1-development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run urgency evaluation with machine-readable report
        run: python scripts/evaluate.py --json-out "$RUNNER_TEMP/medfindr-urgency-evaluation.json"

      - name: Run medication signal evaluation with machine-readable report
        run: python scripts/evaluate_signals.py --json-out "$RUNNER_TEMP/medfindr-signal-evaluation.json"

      - name: Run review workflow evaluation
        run: python scripts/evaluate_reviews.py

      - name: Upload synthetic evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: medfindr-evaluation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/medfindr-urgency-evaluation.json
            ${{ runner.temp }}/medfindr-signal-evaluation.json
          if-no-files-found: error
          retention-days: 30
